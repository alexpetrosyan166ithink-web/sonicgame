    <script>
    new QuizEngine({
        title: "STATISTICS & PROBABILITY",
        subtitle: "Mean, Median, Mode & Chance",
        tips: {
            "mean": "Mean (average) = sum of all values ÷ number of values. Add them up, then divide!",
            "median": "Median is the middle value when data is sorted. With an even count, average the two middle numbers.",
            "mode": "Mode is the value that appears most often. A data set can have no mode, one mode, or multiple modes.",
            "range": "Range = highest value − lowest value. It shows the spread of the data.",
            "probability": "Probability = favorable outcomes ÷ total outcomes. Always between 0 (impossible) and 1 (certain)."
        },
        questions: [
            {
                question: "What is the <strong>mean</strong> of: 4, 8, 6, 10, 2?",

            },
            {

                options: ["A) 3", "B) 5", "C) 7", "D) 9"],

                topic: "median"
            },
            {

                answer: 1,
                topic: "mode"
            },
            {
                question: "A fair coin is flipped. What is the probability of getting <strong>heads</strong>?",

                topic: "probability"
            },
            {
                question: "What is the <strong>range</strong> of: 12, 5, 8, 20, 3?",

            },

                answer: 2,
                topic: "probability"
            },

                topic: "median"
            },
            {

                options: ["A) 80", "B) 85", "C) 87", "D) 90"],

                topic: "mean"
            },
            {
                question: "A standard die is rolled. What is the probability of getting a number <strong>greater than 4</strong>?",
