    <script>
    new QuizEngine({
        title: "GEOMETRY",
        subtitle: "Angles, Areas, Perimeters & Shapes",
        tips: {
            "angles": "Remember: acute < 90°, right = 90°, obtuse > 90°, straight = 180°. Angles in a triangle always add up to 180°.",
            "area": "Area formulas — Rectangle: length × width, Triangle: ½ × base × height, Circle: π × r².",

            "shapes": "Learn properties of shapes — number of sides, symmetry, and angle sums (e.g. quadrilateral = 360°).",

        },
        questions: [
            {
                question: "What is the area of a rectangle with length <strong>8 cm</strong> and width <strong>5 cm</strong>?",

                answer: 2,
                topic: "area"
            },
            {
                question: "How many degrees are in a <strong>right angle</strong>?",

                answer: 1,
                topic: "angles"
            },
            {
                question: "What is the perimeter of a square with side length <strong>6 cm</strong>?",
                options: ["A) 12 cm", "B) 18 cm", "C) 24 cm", "D) 36 cm"],
                answer: 2,
                topic: "perimeter"
            },
            {
                question: "The three angles of a triangle add up to how many degrees?",
                options: ["A) 90°", "B) 180°", "C) 270°", "D) 360°"],
                answer: 1,
                topic: "angles"
            },
            {
                question: "What is the area of a triangle with base <strong>10 cm</strong> and height <strong>6 cm</strong>?",
                options: ["A) 16 cm²", "B) 60 cm²", "C) 30 cm²", "D) 20 cm²"],
                answer: 2,
                topic: "area"
            },
            {
                question: "How many sides does an <strong>octagon</strong> have?",
                options: ["A) 6", "B) 7", "C) 8", "D) 10"],
                answer: 2,
                topic: "shapes"
            },
            {
                question: "What is the volume of a cube with side length <strong>3 cm</strong>?",
                options: ["A) 9 cm³", "B) 18 cm³", "C) 27 cm³", "D) 36 cm³"],
                answer: 2,
                topic: "volume"
            },
            {
                question: "What type of angle is <strong>135°</strong>?",
                options: ["A) Acute", "B) Right", "C) Obtuse", "D) Straight"],

                topic: "angles"
            },
            {
                question: "What is the perimeter of a rectangle with length <strong>12 cm</strong> and width <strong>7 cm</strong>?",
