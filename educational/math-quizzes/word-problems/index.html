<body>
    <nav class="breadcrumb">
        <a href="../" class="back-link">&#8592; BACK TO QUIZZES</a>
    </nav>
    <div class="quiz-container" id="quiz-root"></div>
    <script src="../quiz-engine.js"></script>
    <script>
    new QuizEngine({
        title: "WORD PROBLEMS",
        subtitle: "Money, Time, Distance & Everyday Math",
        tips: {
            "money": "For money problems, watch for tax, discounts, and tips. Break multi-step problems into smaller parts.",
            "time": "Convert everything to the same unit first — minutes to hours or vice versa. Remember: 1 hour = 60 minutes.",
            "distance": "Use the formula: Distance = Speed × Time. Make sure units match before calculating!",
            "ratio": "Ratios compare quantities. To solve, find the value of one 'part' first, then multiply for each group.",
            "multi-step": "Read carefully and solve one step at a time. Underline key numbers and what the question asks for."
        },
        questions: [
            {
                question: "A pizza costs <strong>$12</strong>. You and 3 friends split it equally. How much does each person pay?",
                options: ["A) $2", "B) $3", "C) $4", "D) $6"],
                answer: 1,
                topic: "money"
            },
            {
                question: "A train leaves at <strong>2:45 PM</strong> and arrives at <strong>5:15 PM</strong>. How long is the trip?",
                options: ["A) 2 hours", "B) 2 hours 15 min", "C) 2 hours 30 min", "D) 3 hours"],
                answer: 2,
                topic: "time"
            },
            {
                question: "A car travels at <strong>60 km/h</strong> for <strong>2.5 hours</strong>. How far does it go?",
                options: ["A) 120 km", "B) 130 km", "C) 150 km", "D) 180 km"],
                answer: 2,
                topic: "distance"
            },
            {
                question: "In a class, the ratio of boys to girls is <strong>3:5</strong>. If there are <strong>15 boys</strong>, how many girls are there?",
                options: ["A) 20", "B) 25", "C) 30", "D) 35"],
                answer: 1,
                topic: "ratio"
            },
            {
                question: "You buy <strong>3 books at $8 each</strong> and a bag for <strong>$15</strong>. How much do you spend?",
                options: ["A) $31", "B) $36", "C) $39", "D) $42"],
                answer: 2,
                topic: "multi-step"
            },
            {
                question: "A movie is <strong>1 hour 45 minutes</strong> long. If it starts at <strong>6:30 PM</strong>, when does it end?",
                options: ["A) 7:45 PM", "B) 8:00 PM", "C) 8:15 PM", "D) 8:30 PM"],
                answer: 2,
                topic: "time"
            },
            {
                question: "You have <strong>$50</strong>. You buy a meal for <strong>$18.50</strong> and a drink for <strong>$4.50</strong>. How much change do you get?",
                options: ["A) $23", "B) $25", "C) $27", "D) $29"],
                answer: 2,
                topic: "money"
            },
            {
                question: "A cyclist rides at <strong>15 km/h</strong>. How long does it take to travel <strong>45 km</strong>?",
                options: ["A) 2 hours", "B) 2.5 hours", "C) 3 hours", "D) 3.5 hours"],
                answer: 2,
                topic: "distance"
            },
            {
                question: "A recipe needs flour and sugar in a <strong>4:1 ratio</strong>. If you use <strong>200g of flour</strong>, how much sugar do you need?",
                options: ["A) 25g", "B) 40g", "C) 50g", "D) 80g"],
                answer: 2,
                topic: "ratio"
            },
            {
                question: "A shop sells pencils for <strong>$0.75 each</strong>. You buy <strong>8 pencils</strong> and pay with a <strong>$10 bill</strong>. How much change?",
                options: ["A) $3", "B) $3.50", "C) $4", "D) $4.50"],
                answer: 2,
                topic: "multi-step"
            }
        ]
    });
    </script>
