<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4527A0"/>
      <stop offset="100%" style="stop-color:#311B92"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Bar chart -->
  <line x1="60" y1="200" x2="230" y2="200" stroke="white" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="200" x2="60" y2="60" stroke="white" stroke-width="2" opacity="0.5"/>
  <rect x="75" y="140" width="28" height="60" rx="3" fill="#F44336"/>
  <rect x="110" y="100" width="28" height="100" rx="3" fill="#FF9800"/>
  <rect x="145" y="70" width="28" height="130" rx="3" fill="#4CAF50"/>
  <rect x="180" y="120" width="28" height="80" rx="3" fill="#2196F3"/>
  <!-- Dice -->
  <rect x="270" y="50" width="70" height="70" rx="10" fill="white" stroke="#E0E0E0" stroke-width="2"/>
  <circle cx="290" cy="70" r="5" fill="#333"/>
  <circle cx="320" cy="70" r="5" fill="#333"/>
  <circle cx="305" cy="85" r="5" fill="#333"/>
  <circle cx="290" cy="100" r="5" fill="#333"/>
  <circle cx="320" cy="100" r="5" fill="#333"/>
  <!-- Probability fraction -->
  <text x="305" y="155" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F">P = 1/6</text>
  <!-- Mean/Median labels -->
  <text x="305" y="195" text-anchor="middle" font-family="monospace" font-size="13" fill="#4FC3F7">μ = mean</text>
  <text x="305" y="215" text-anchor="middle" font-family="monospace" font-size="13" fill="#A5D6A7">M = median</text>
  <!-- Bell curve hint -->
  <path d="M60,240 C100,240 120,220 145,220 C170,220 175,240 200,240" fill="none" stroke="#CE93D8" stroke-width="3" opacity="0.6"/>
  <!-- Bottom text -->
  <text x="200" y="278" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD54F" letter-spacing="2">STATS &amp; PROBABILITY</text>
  <!-- Sparkles -->
  <text x="30" y="40" font-size="14" fill="#FFF176" opacity="0.4">✦</text>
  <text x="370" y="280" font-size="16" fill="#FFF176" opacity="0.4">✦</text>
</svg>
