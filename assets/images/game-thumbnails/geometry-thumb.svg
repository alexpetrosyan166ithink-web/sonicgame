<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00695C"/>
      <stop offset="100%" style="stop-color:#004D40"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Triangle -->
  <polygon points="120,70 170,170 70,170" fill="none" stroke="#FF9800" stroke-width="4"/>
  <text x="120" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#FF9800">60°</text>
  <!-- Circle with radius -->
  <circle cx="280" cy="120" r="55" fill="none" stroke="#4FC3F7" stroke-width="4"/>
  <line x1="280" y1="120" x2="335" y2="120" stroke="#4FC3F7" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="308" y="114" font-family="monospace" font-size="11" fill="#4FC3F7">r</text>
  <!-- Square with dimensions -->
  <rect x="70" y="190" width="80" height="80" fill="none" stroke="#E91E63" stroke-width="4" rx="2"/>
  <text x="110" y="240" text-anchor="middle" font-family="monospace" font-size="12" fill="#E91E63">A=s²</text>
  <!-- Protractor arc -->
  <path d="M 240,240 A 60,60 0 0,1 340,240" fill="none" stroke="#FFD54F" stroke-width="3"/>
  <line x1="240" y1="240" x2="340" y2="240" stroke="#FFD54F" stroke-width="2"/>
  <line x1="240" y1="240" x2="290" y2="188" stroke="#FFD54F" stroke-width="2"/>
  <text x="275" y="232" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFD54F">90°</text>
  <!-- Small right angle marker -->
  <rect x="240" y="228" width="12" height="12" fill="none" stroke="#FFD54F" stroke-width="1.5"/>
  <!-- Grid dots -->
  <circle cx="200" cy="30" r="2" fill="white" opacity="0.3"/>
  <circle cx="220" cy="30" r="2" fill="white" opacity="0.3"/>
  <circle cx="200" cy="50" r="2" fill="white" opacity="0.3"/>
  <circle cx="220" cy="50" r="2" fill="white" opacity="0.3"/>
  <circle cx="180" cy="30" r="2" fill="white" opacity="0.3"/>
  <circle cx="180" cy="50" r="2" fill="white" opacity="0.3"/>
  <!-- Stars -->
  <text x="30" y="40" font-size="16" fill="#FFF176" opacity="0.4">✦</text>
  <text x="370" y="35" font-size="14" fill="#FFF176" opacity="0.4">✦</text>
</svg>
