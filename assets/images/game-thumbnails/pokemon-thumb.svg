<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#cdeaf7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="340" cy="50" r="22" fill="#fff5b0"/>

  <!-- Mountains -->
  <polygon points="0,200 60,140 120,180 180,130 240,180 300,140 400,200 400,300 0,300" fill="#7090c0"/>

  <!-- Grass -->
  <rect x="0" y="220" width="400" height="80" fill="#8fc859"/>
  <ellipse cx="100" cy="260" rx="80" ry="14" fill="#6ba03f"/>
  <ellipse cx="300" cy="195" rx="70" ry="12" fill="#7fb84a"/>

  <!-- Pikachu (left, player) -->
  <g transform="translate(100,260)">
    <!-- ears -->
    <polygon points="-22,-44 -32,-72 -10,-50" fill="#fcd83d"/>
    <polygon points="22,-44 32,-72 10,-50" fill="#fcd83d"/>
    <polygon points="-32,-72 -23,-58 -16,-63" fill="#202020"/>
    <polygon points="32,-72 23,-58 16,-63" fill="#202020"/>
    <!-- body -->
    <ellipse cx="0" cy="-22" rx="28" ry="26" fill="#fcd83d"/>
    <ellipse cx="0" cy="-16" rx="20" ry="17" fill="#fff1a8"/>
    <!-- cheeks -->
    <circle cx="-17" cy="-16" r="5" fill="#e8443c"/>
    <circle cx="17" cy="-16" r="5" fill="#e8443c"/>
    <!-- eyes -->
    <circle cx="-9" cy="-28" r="4" fill="#202020"/>
    <circle cx="9" cy="-28" r="4" fill="#202020"/>
    <circle cx="-8" cy="-29" r="1.5" fill="#fff"/>
    <circle cx="10" cy="-29" r="1.5" fill="#fff"/>
    <!-- tail -->
    <polygon points="20,-22 40,-36 33,-26 47,-17 33,-12 40,-4 23,-12" fill="#fcd83d"/>
  </g>

  <!-- Charmander (right, opponent) -->
  <g transform="translate(300,195)">
    <!-- tail + flame -->
    <path d="M 22,-14 Q 50,-7 43,-36 Q 35,-22 22,-22 Z" fill="#f08030"/>
    <path d="M 43,-36 Q 56,-50 47,-65 Q 40,-50 43,-36 Z" fill="#ff7f00"/>
    <path d="M 45,-40 Q 52,-50 47,-60 Q 42,-49 45,-40 Z" fill="#ffd200"/>
    <!-- body -->
    <ellipse cx="0" cy="-20" rx="22" ry="23" fill="#f08030"/>
    <ellipse cx="0" cy="-16" rx="16" ry="16" fill="#fbd2a0"/>
    <!-- head -->
    <circle cx="0" cy="-44" r="20" fill="#f08030"/>
    <ellipse cx="0" cy="-38" rx="11" ry="7" fill="#fbd2a0"/>
    <circle cx="-7" cy="-50" r="3.5" fill="#fff"/>
    <circle cx="7" cy="-50" r="3.5" fill="#fff"/>
    <circle cx="-7" cy="-50" r="2" fill="#202020"/>
    <circle cx="7" cy="-50" r="2" fill="#202020"/>
  </g>

  <!-- Lightning bolt accent -->
  <polygon points="200,30 215,30 207,55 222,55 195,90 203,65 188,65" fill="#ffcb05" stroke="#202020" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="400" height="32" fill="rgba(42,117,187,0.85)"/>
  <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffcb05" stroke="#202020" stroke-width="0.6">POKEMON BATTLE</text>
</svg>
