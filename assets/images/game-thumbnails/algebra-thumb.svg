<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#0D3B0F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Chalkboard frame -->
  <rect x="40" y="30" width="320" height="200" rx="4" fill="#2E7D32" stroke="#5D4037" stroke-width="8"/>
  <!-- Chalk equations -->
  <text x="200" y="80" text-anchor="middle" font-family="monospace" font-size="26" font-weight="bold" fill="white" opacity="0.95">2x + 5 = 15</text>
  <text x="200" y="120" text-anchor="middle" font-family="monospace" font-size="22" fill="#FFD54F" opacity="0.9">2x = 10</text>
  <text x="200" y="160" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#A5D6A7">x = 5</text>
  <!-- Underline -->
  <line x1="150" y1="168" x2="250" y2="168" stroke="#A5D6A7" stroke-width="2"/>
  <!-- Chalk dust -->
  <circle cx="280" cy="195" r="3" fill="white" opacity="0.3"/>
  <circle cx="290" cy="200" r="2" fill="white" opacity="0.2"/>
  <circle cx="275" cy="202" r="2" fill="white" opacity="0.25"/>
  <!-- Big X variable -->
  <text x="60" y="280" font-family="monospace" font-size="40" font-weight="bold" fill="#FF8A80" opacity="0.6" transform="rotate(-10,60,280)">X</text>
  <text x="330" y="275" font-family="monospace" font-size="32" font-weight="bold" fill="#CE93D8" opacity="0.5" transform="rotate(8,330,275)">Y</text>
  <!-- Bottom label -->
  <text x="200" y="272" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#FFD54F" letter-spacing="2">ALGEBRA</text>
  <!-- Sparkles -->
  <text x="25" y="25" font-size="14" fill="#FFF176" opacity="0.4">✦</text>
  <text x="375" y="22" font-size="16" fill="#FFF176" opacity="0.5">✦</text>
</svg>
