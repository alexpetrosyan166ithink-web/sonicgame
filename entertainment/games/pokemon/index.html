<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../../../assets/images/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Battle 3D - Free Online Turn-Based Battle Game</title>
    <meta name="description" content="Play Pokemon Battle 3D online free - choose your starter and battle through wild pokemon and trainers all the way to the Champion's Mewtwo.">
    <meta name="keywords" content="pokemon battle 3d, pokemon game, pikachu, charmander, bulbasaur, squirtle, mewtwo, free online game, browser game">
    <link rel="canonical" href="https://alexgames.am/entertainment/games/pokemon/">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="breadcrumb">
        <a href="../../">&#8592; BACK TO ENTERTAINMENT</a>
    </div>

    <div id="game-container">
        <div id="scene"></div>

        <div id="hud" class="hidden">
            <div class="hp-card hp-enemy">
                <div class="hp-row">
                    <span class="hp-name" id="enemyName">-</span>
                    <span class="hp-type" id="enemyType">-</span>
                </div>
                <div class="hp-bar"><div class="hp-fill" id="enemyHpFill"></div></div>
                <div class="hp-num"><span id="enemyHpNum">0/0</span></div>
            </div>
            <div class="hp-card hp-player">
                <div class="hp-row">
                    <span class="hp-name" id="playerName">-</span>
                    <span class="hp-type" id="playerType">-</span>
                </div>
                <div class="hp-bar"><div class="hp-fill" id="playerHpFill"></div></div>
                <div class="hp-num"><span id="playerHpNum">0/0</span></div>
            </div>
        </div>

        <div id="bottomPanel" class="hidden">
            <div id="moveBox" class="hidden">
                <div class="moves" id="moves"></div>
                <p class="run-hint" id="runHint">Press R to run</p>
            </div>
            <div id="messageBox" class="hidden">
                <p id="messageText"></p>
                <p class="enter-hint">press ENTER to skip</p>
            </div>
        </div>

        <div id="screen">
            <h1>POKEMON BATTLE 3D</h1>
            <p>Choose your starter!</p>
            <div class="starters" id="starterPick"></div>
            <div id="controls">
                <p>1 / 2 / 3 / 4 - pick a move during battle</p>
                <p>R - run from wild pokemon &nbsp;|&nbsp; ENTER - skip message</p>
                <p>Drag mouse - orbit camera</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
